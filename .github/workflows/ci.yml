name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  clippy:
    name: Clippy
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Warnings are reported, not fatal: ported code still has style warnings (cleanup in progress).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked

  test-default:
    name: Default tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # victory-gpu's tests need a real D3D12 card (SM 6.6); GitHub's runners have none.
      # Run them on a PC with an NVIDIA or AMD card: cargo test --release -p victory-gpu -- --test-threads=1
      - run: cargo test --workspace --exclude victory-gpu --locked

  test-diagnostics:
    name: Diagnostics tests
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude victory-gpu --all-features --locked -- --test-threads=1

  check:
    needs: [clippy, test-default, test-diagnostics]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Require all three jobs to pass
        run: |
          if ('${{ needs.clippy.result }}' -ne 'success' -or
              '${{ needs.test-default.result }}' -ne 'success' -or
              '${{ needs.test-diagnostics.result }}' -ne 'success') {
            exit 1
          }
